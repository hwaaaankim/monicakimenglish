<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{front/fragments/common :: head('강의 결제')}"></head>

<body class="stretched mk-platform-page">
	<div id="wrapper" class="clearfix">
		<th:block th:replace="~{front/fragments/common :: header}"></th:block>
		<main class="mk-my-page">
			<div class="container">
				<div class="row justify-content-center">
					<div class="col-12 col-lg-7">
						<div class="mk-checkout-card"><span class="mk-dev-badge">개발용 MOCK PG</span>
							<h1>강의 결제</h1>
							<div class="mk-checkout-line"><span>상품명</span><strong th:text="${lecture.title}"></strong>
							</div>
							<div class="mk-checkout-line"><span>수강기간</span><strong
									th:text="${lecture.viewingDays == null ? '무제한' : lecture.viewingDays + '일'}"></strong>
							</div>
							<div class="mk-checkout-total"><span>최종 결제금액</span><strong
									th:text="${#numbers.formatInteger(lecture.price,0,'COMMA') + '원'}"></strong></div>
							<p class="mk-payment-note">현재는 Toss Payments 등 실제 PG 연동 전 단계이므로 결제 승인 버튼을 누르면 테스트 결제 성공으로
								처리됩니다. 실운영 전에는 서버 승인 API와 Webhook 검증으로 교체해야 합니다.</p>
							<form method="post" th:action="@{/payments/mock/approve/{id}(id=${lecture.id})}"><button
									class="mk-primary-btn w-100">테스트 결제 승인</button></form><a
								class="mk-secondary-btn w-100 mt-2"
								th:href="@{/lectures/{id}(id=${lecture.id})}">돌아가기</a>
						</div>
					</div>
				</div>
			</div>
		</main>
		<th:block th:replace="~{front/fragments/common :: footer}"></th:block>
	</div>
	<th:block th:replace="~{front/fragments/common :: script}"></th:block>
</body>

</html>
