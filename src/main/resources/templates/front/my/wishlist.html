<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{front/fragments/common :: head('찜 목록')}"></head><body class="stretched mk-platform-page"><div id="wrapper" class="clearfix"><th:block th:replace="~{front/fragments/common :: header}"></th:block>
<main class="mk-my-page"><div class="container"><div class="mk-page-title"><small>WISHLIST</small><h1>찜 목록</h1><p>나중에 보고 싶은 미구입 강의를 모아두었습니다.</p></div><form class="mk-filter-panel"><div class="row g-2 align-items-end"><div class="col-12 col-lg-8"><label>강의 제목<input type="search" name="q" th:value="${q}" placeholder="강의 제목 검색"></label></div><div class="col-6 col-lg-2"><label>가격<select name="pricing"><option value="ALL">전체</option><option value="FREE" th:selected="${pricing=='FREE'}">무료</option><option value="PAID" th:selected="${pricing=='PAID'}">유료</option></select></label></div><div class="col-6 col-lg-2"><button class="mk-primary-btn w-100">검색</button></div></div></form><div class="mk-empty-state" th:if="${#lists.isEmpty(lectures)}"><h3>찜한 강의가 없습니다.</h3><a class="mk-primary-btn" href="/lectures">강의 둘러보기</a></div><div class="row g-3 mk-lecture-grid"><div class="col-12 col-md-6 col-lg-4" th:each="item:${lectures}"><th:block th:replace="~{front/fragments/lecture-card :: card(${item})}"></th:block></div></div></div></main>
<th:block th:replace="~{front/fragments/common :: footer}"></th:block></div><th:block th:replace="~{front/fragments/common :: script}"></th:block><script src="/front/js/lecture.js"></script></body></html>
