<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{front/fragments/common :: head('개인정보')}"></head><body class="stretched mk-platform-page"><div id="wrapper" class="clearfix"><th:block th:replace="~{front/fragments/common :: header}"></th:block>
<main class="mk-my-page"><div class="container"><div class="mk-page-title"><small>PROFILE</small><h1>개인정보</h1><p>아이디는 변경할 수 없으며 연락처는 아이디·비밀번호 찾기에도 사용됩니다.</p></div><div class="row g-3"><div class="col-12 col-lg-7"><div class="mk-form-card"><h2>회원정보</h2><div class="mk-alert success" th:if="${param.saved}">회원정보를 저장했습니다.</div><div class="mk-alert error" th:if="${profileError}" th:text="${profileError}"></div><form method="post" th:action="@{/my/profile}" class="mk-form-stack"><label>아이디<input th:value="${client.username}" readonly></label><label>성함<input name="name" th:value="${client.name}" required></label><label>휴대폰번호<input class="js-phone" name="phone" th:value="${client.phone}" maxlength="13" required></label><label>이메일 <small>선택</small><input type="email" name="email" th:value="${client.email}"></label><label>생년월일<input th:value="${client.birthDate}" readonly></label><button class="mk-primary-btn">회원정보 저장</button></form></div></div><div class="col-12 col-lg-5"><div class="mk-form-card"><h2>비밀번호 변경</h2><div class="mk-alert success" th:if="${param.passwordChanged}">비밀번호를 변경했습니다.</div><div class="mk-alert error" th:if="${passwordError}" th:text="${passwordError}"></div><form method="post" th:action="@{/my/password}" class="mk-form-stack"><label>현재 비밀번호<input type="password" name="currentPassword" required></label><label>새 비밀번호<input type="password" name="newPassword" required><small>영문+특수문자 포함 8자 이상</small></label><label>새 비밀번호 확인<input type="password" name="confirmPassword" required></label><button class="mk-secondary-btn">비밀번호 변경</button></form></div></div></div></div></main>
<th:block th:replace="~{front/fragments/common :: footer}"></th:block></div><th:block th:replace="~{front/fragments/common :: script}"></th:block><script src="/front/js/auth.js"></script></body></html>
