<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{front/fragments/common :: head('결제 내역')}"></head>

<body class="stretched mk-platform-page">
	<div id="wrapper" class="clearfix">
		<th:block th:replace="~{front/fragments/common :: header}"></th:block>
		<main class="mk-my-page">
			<div class="container">
				<div class="mk-page-title"><small>PAYMENTS</small>
					<h1>결제 내역 확인</h1>
					<p>주문별 결제 상태를 확인할 수 있습니다. 샘플·테스트 결제는 실제 청구된 결제와 구분하여 표시합니다.</p>
				</div>
				<div class="mk-table-card">
					<div class="table-responsive">
						<table class="table mk-table">
							<thead>
								<tr>
									<th>결제일</th>
									<th>주문번호</th>
									<th>강의</th>
									<th>결제수단</th>
									<th>금액</th>
									<th>상태</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="p:${payments}">
									<td th:text="${#temporals.format(p.requestedAt,'yyyy.MM.dd HH:mm')}"></td>
									<td><span th:text="${p.orderNo}"></span><br>
                                        <a th:if="${p.status.name() == 'PENDING' and p.paymentKey != null and (p.provider == 'TOSS' or p.provider == 'TOSS_TEST')}" th:href="@{/payments/recover/{orderId}(orderId=${p.orderNo})}">같은 주문으로 결제 상태 확인</a></td>
									<td><a th:href="@{/lectures/{id}(id=${p.lecture.id})}"
											th:text="${p.lectureTitleSnapshot}"></a></td>
									<td th:text="${p.provider == 'MOCK' ? '샘플 결제' : (p.provider == 'TOSS_TEST' ? '토스 테스트' : '토스페이먼츠')}"></td>
									<td th:text="${#numbers.formatInteger(p.amount,0,'COMMA') + '원'}"></td>
									<td><span class="mk-status-badge" th:text="${p.status.name() == 'PAID' ? '결제완료' : (p.status.name() == 'PENDING' ? '결제대기' : (p.status.name() == 'REFUNDED' ? '환불완료' : (p.status.name() == 'PARTIALLY_REFUNDED' ? '부분환불' : (p.status.name() == 'CANCELED' ? '결제취소' : '결제실패'))))}"></span></td>
								</tr>
								<tr th:if="${#lists.isEmpty(payments)}">
									<td colspan="6" class="text-center py-5">결제 내역이 없습니다.</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</main>
		<th:block th:replace="~{front/fragments/common :: footer}"></th:block>
	</div>
	<th:block th:replace="~{front/fragments/common :: script}"></th:block>
</body>

</html>
