<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
	<meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
	<title>MonicaKim 관리자</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link href="/admin/lib/bootstrap/css/bootstrap.min.css" rel="stylesheet">
	<link href="/admin/lib/font-awesome/css/font-awesome.css" rel="stylesheet">
	<link href="/admin/css/platform-admin.css?v=20260824-3" rel="stylesheet">
	<link href="/admin/css/popup-admin.css?v=20260825-2" rel="stylesheet">
	<link href="/front/css/site-polish.css?v=20261013-1" rel="stylesheet">
	<link href="/admin/css/lecture-upgrade.css?v=20261013-1" rel="stylesheet">
</head>

<body>
	<th:block th:fragment="header">
		<header class="mk-admin-header"><a class="mk-admin-logo"
				href="/admin/dashboard">MONICA<span>KIM</span><small>ADMIN</small></a><button
				class="mk-admin-menu-toggle" type="button"><i class="fa fa-bars"></i></button>
			<div class="mk-admin-user"><span th:if="${currentUser != null}"
					th:text="${currentUser.displayName + '님'}">관리자님</span>
				<form th:action="@{/admin/logout}" method="post"><button type="submit">로그아웃</button></form>
			</div>
		</header>
		<aside class="mk-admin-sidebar">
			<nav><a href="/admin/dashboard"><i class="fa fa-home"></i>대시보드</a><a href="/admin/members"><i
						class="fa fa-users"></i>회원관리</a><a href="/admin/lectures"><i
						class="fa fa-play-circle"></i>영상관리</a><a href="/admin/popups"><i
						class="fa fa-window-restore"></i>팝업관리</a><a href="/admin/sales"><i
						class="fa fa-line-chart"></i>매출관리</a></nav>
		</aside>
	</th:block>
	<th:block th:fragment="script">
		<script src="/admin/lib/jquery/jquery.min.js"></script>
		<script src="/admin/lib/bootstrap/js/bootstrap.min.js"></script>
		<script src="/admin/js/platform-admin.js"></script>
	</th:block>
</body>

</html>
