<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{admin/fragments/common :: head}"></head><body><th:block th:replace="~{admin/fragments/common :: header}"></th:block><main class="mk-admin-main"><div class="container-fluid"><div class="mk-admin-title"><div><small>SALES</small><h1>매출관리</h1><p>실제 토스 결제의 환불 차감 후 금액입니다. 샘플·테스트 결제는 매출에서 제외합니다.</p></div></div><form class="mk-admin-filter"><div class="row"><div class="col-xs-6 col-lg-3"><label>시작일<input type="date" name="from" th:value="${from}"></label></div><div class="col-xs-6 col-lg-3"><label>종료일<input type="date" name="to" th:value="${to}"></label></div><div class="col-xs-12 col-lg-4"><div class="mk-preset-buttons"><a href="?preset=7">7일</a><a href="?preset=30">1개월</a><a href="?preset=90">3개월</a><a href="?preset=365">1년</a></div></div><div class="col-xs-12 col-lg-2"><button>조회</button></div></div></form><div class="row"><div class="col-sm-4"><div class="mk-stat-card"><span>결제 매출</span><strong th:text="${#numbers.formatInteger(totalRevenue,0,'COMMA')+'원'}"></strong></div></div><div class="col-sm-4"><div class="mk-stat-card"><span>판매 수</span><strong th:text="${totalSales+'건'}"></strong></div></div><div class="col-sm-4"><div class="mk-stat-card"><span>조회 수</span><strong th:text="${totalViews+'회'}"></strong></div></div></div><div class="mk-admin-panel"><div class="mk-panel-heading"><h2>강의별 실적</h2><span>매출·조회·재생시간 모두 선택 기간 기준</span></div><div class="table-responsive"><table class="table mk-admin-table"><thead><tr><th>순위</th><th>강의</th><th>판매수</th><th>매출</th><th>조회수</th><th>총 재생시간</th></tr></thead><tbody><tr th:each="r,st:${rows}"><td th:text="${st.count}"></td><td><a th:href="@{/admin/lectures/{id}(id=${r.lectureId})}" th:text="${r.title}"></a></td><td th:text="${r.salesCount+'건'}"></td><td><strong th:text="${#numbers.formatInteger(r.revenue,0,'COMMA')+'원'}"></strong></td><td th:text="${r.viewCount+'회'}"></td><td th:text="${T(java.lang.String).format('%d시간 %02d분', r.playSeconds/3600,(r.playSeconds%3600)/60)}"></td></tr></tbody></table></div></div></div></main><th:block th:replace="~{admin/fragments/common :: script}"></th:block></body></html>
