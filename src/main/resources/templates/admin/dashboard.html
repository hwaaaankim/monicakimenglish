<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{admin/fragments/common :: head}"></head><body><th:block th:replace="~{admin/fragments/common :: header}"></th:block><main class="mk-admin-main"><div class="container-fluid"><div class="mk-admin-title"><div><small>DASHBOARD</small><h1>운영 현황</h1></div></div><div class="row"><div class="col-sm-6 col-lg-4"><div class="mk-stat-card"><span>전체 회원</span><strong th:text="${#numbers.formatInteger(memberCount,0,'COMMA')}">0</strong></div></div><div class="col-sm-6 col-lg-4"><div class="mk-stat-card"><span>전체 강의</span><strong th:text="${lectureCount}">0</strong></div></div><div class="col-sm-12 col-lg-4"><div class="mk-stat-card"><span>최근 30일 매출</span><strong th:text="${#numbers.formatInteger(revenue30,0,'COMMA') + '원'}">0원</strong></div></div></div><div class="mk-admin-panel"><div class="mk-panel-heading"><h2>최근 30일 매출 상위 강의</h2><a href="/admin/sales">전체 매출 보기</a></div><div class="table-responsive"><table class="table mk-admin-table"><thead><tr><th>강의</th><th>판매수</th><th>매출</th><th>조회수</th></tr></thead><tbody><tr th:each="r:${salesRows}"><td><a th:href="@{/admin/lectures/{id}(id=${r.lectureId})}" th:text="${r.title}"></a></td><td th:text="${r.salesCount}"></td><td th:text="${#numbers.formatInteger(r.revenue,0,'COMMA') + '원'}"></td><td th:text="${r.viewCount}"></td></tr></tbody></table></div></div></div></main><th:block th:replace="~{admin/fragments/common :: script}"></th:block></body></html>
