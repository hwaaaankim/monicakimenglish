<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{admin/fragments/common :: head}"></head><body><th:block th:replace="~{admin/fragments/common :: header}"></th:block><main class="mk-admin-main"><div class="container-fluid"><div class="mk-admin-title"><div><small>MEMBER DETAIL</small><h1 th:text="${member.name + ' 회원'}"></h1></div><a class="mk-admin-secondary" href="/admin/members">목록</a></div><div class="row"><div class="col-xs-12 col-lg-8"><div class="mk-admin-panel"><form th:action="@{/admin/members/{id}(id=${member.id})}" method="post" class="mk-admin-form"><div class="row"><div class="col-sm-6"><label>아이디<input th:value="${member.username}" readonly></label></div><div class="col-sm-6"><label>이름<input name="name" th:value="${member.name}" required></label></div><div class="col-sm-6"><label>연락처<input name="phone" th:value="${member.phone}" required></label></div><div class="col-sm-6"><label>이메일<input name="email" th:value="${member.email}"></label></div><div class="col-sm-6"><label>생년월일<input th:value="${member.birthDate}" readonly></label></div><div class="col-sm-6"><label>회원상태<select name="status"><option value="ACTIVE" th:selected="${member.status.name()=='ACTIVE'}">정상</option><option value="SUSPENDED" th:selected="${member.status.name()=='SUSPENDED'}">정지</option><option value="WITHDRAWN" th:selected="${member.status.name()=='WITHDRAWN'}">탈퇴</option></select></label></div></div><button class="mk-admin-primary">변경사항 저장</button></form></div></div><div class="col-xs-12 col-lg-4"><div class="mk-admin-panel mk-admin-meta"><h3>가입 정보</h3><dl><dt>가입일</dt><dd th:text="${#temporals.format(member.createdAt,'yyyy.MM.dd HH:mm')}"></dd><dt>최근 로그인</dt><dd th:text="${member.lastLoginAt == null ? '-' : #temporals.format(member.lastLoginAt,'yyyy.MM.dd HH:mm')}"></dd><dt>개인정보 동의</dt><dd th:text="${member.privacyAgreed ? '동의' : '미동의'}"></dd></dl></div></div></div></div></main><th:block th:replace="~{admin/fragments/common :: script}"></th:block></body></html>
