<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{admin/fragments/common :: head}"></head><body><th:block th:replace="~{admin/fragments/common :: header}"></th:block><main class="mk-admin-main"><div class="container-fluid"><div class="mk-admin-title"><div><small>MEMBERS</small><h1>회원관리</h1></div></div><form class="mk-admin-filter"><div class="row"><div class="col-xs-12 col-lg-8"><label>아이디 / 이름 / 연락처<input name="q" th:value="${q}" placeholder="검색어"></label></div><div class="col-xs-8 col-lg-2"><label>회원상태<select name="status"><option value="ALL">전체</option><option value="ACTIVE" th:selected="${status=='ACTIVE'}">정상</option><option value="SUSPENDED" th:selected="${status=='SUSPENDED'}">정지</option><option value="WITHDRAWN" th:selected="${status=='WITHDRAWN'}">탈퇴</option></select></label></div><div class="col-xs-4 col-lg-2"><button>검색</button></div></div></form><div class="mk-admin-panel"><div class="table-responsive"><table class="table mk-admin-table"><thead><tr><th>ID</th><th>아이디</th><th>이름</th><th>연락처</th><th>이메일</th><th>상태</th><th>가입일</th></tr></thead><tbody><tr th:each="m:${members}" th:onclick="|location.href='/admin/members/${m.id}'|" class="clickable"><td th:text="${m.id}"></td><td th:text="${m.username}"></td><td th:text="${m.name}"></td><td th:text="${m.phone}"></td><td th:text="${m.email ?: '-'}"></td><td><span class="mk-state" th:classappend="${m.status}" th:text="${m.status}"></span></td><td th:text="${#temporals.format(m.createdAt,'yyyy.MM.dd')}"></td></tr></tbody></table></div></div></div></main><th:block th:replace="~{admin/fragments/common :: script}"></th:block></body></html>
